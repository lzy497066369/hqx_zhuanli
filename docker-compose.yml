# 目录名是中文时 compose 推不出项目名，这里固定。
name: zhichuang
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: zhichuang-frontend:latest
    container_name: zhichuang-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:80"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: zhichuang-backend:latest
    container_name: zhichuang-backend
    restart: unless-stopped
    # API 仅供 Compose 内部访问，浏览器通过前端 Nginx 的同源代理调用。
    expose:
      - "4173"
    # 密钥只放在宿主机的 .env.local，不进镜像、不进仓库。
    env_file:
      - .env.local
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      SERVE_FRONTEND: "false"
      # 浏览器访问用的站点来源白名单，经网关后 Host 保持原样，
      # 所以必须列出实际访问地址；值来自同目录 .env。
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:4173,http://localhost:4173}
      FREECAD_CMD: /usr/bin/freecadcmd
      FREECAD_TIMEOUT_MS: "300000"
      STORAGE_DRIVER: mysql
      AUTH_REQUIRED: "true"
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhichuang}
      MYSQL_USER: ${MYSQL_USER:-zhichuang}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}
      MYSQL_WORKSPACE_ID: default
    depends_on:
      mysql:
        condition: service_healthy
    # 服务端同时保留 10 个完整生成任务，其余按 FIFO 排队；多步骤间不释放名额。
    deploy:
      resources:
        limits:
          memory: 3g
    tmpfs:
      - /tmp:size=1g
    security_opt:
      - no-new-privileges:true

  mysql:
    image: mysql:8.4
    container_name: zhichuang-mysql
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--max-allowed-packet=134217728"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zhichuang}
      MYSQL_USER: ${MYSQL_USER:-zhichuang}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中配置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中配置 MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=TCP -h127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # 局域网网关：账号鉴权后转发到应用容器。见 deploy/Caddyfile。
  # 只绑局域网网卡 192.168.0.58，因此只有本网段能连到；本机 IP 变化时改这一行。
  gateway:
    image: caddy:2-alpine
    container_name: zhichuang-gateway
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "192.168.0.58:80:80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
